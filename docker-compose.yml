services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunch_delivery_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=mysql://${DB_USER:-root}:${DB_PASSWORD:-rootpassword}@db:3306/${DB_NAME:-lunch_delivery}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lunch_delivery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-lunch_delivery}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
